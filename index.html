<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSS practice: accessible signup theme</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page-shell">
      <form class="signup-card" action="#confirmation" method="get">
        <div class="form-heading">
          <p class="eyebrow">Study circle</p>
          <h1>Reserve a practice seat</h1>
          <p id="required-note">All fields are required.</p>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email"
                 aria-describedby="email-help" required>
          <p class="help" id="email-help">Use the address where you want the mock schedule sent.</p>
        </div>

        <div class="field">
          <label for="track">Practice track</label>
          <select id="track" name="track" required>
            <option value="">Choose a track</option>
            <option>HTML foundations</option>
            <option>CSS foundations</option>
          </select>
        </div>

        <button type="submit">Reserve demo seat</button>
        <p class="confirmation" id="confirmation">Demo only: this form does not save or send information.</p>
      </form>
    </main>
  </body>
</html>
